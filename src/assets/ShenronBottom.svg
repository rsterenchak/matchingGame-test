<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240">
  <defs>
    <linearGradient id="bodyGradBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2db858"/>
      <stop offset="45%" stop-color="#1a7a30"/>
      <stop offset="100%" stop-color="#0f4f20"/>
    </linearGradient>
  </defs>

  <!-- ===== TAIL TIP (left side, pointed) ===== -->
  <!-- Tail tapers to a point at the far left -->
  <path d="M 0 122
           C 8 116, 20 112, 36 114
           L 80 118
           L 80 128
           L 36 132
           C 20 134, 8 130, 0 124
           Z"
        fill="#1a6b2d"/>

  <!-- Tail curl / spike at the very tip -->
  <path d="M 0 120 C 5 106, 18 100, 28 110 C 34 118, 28 130, 18 134 C 10 136, 2 130, 0 124"
        fill="#1f7a30" opacity="0.8"/>

  <!-- ===== BODY – ribbon from tail to right edge ===== -->
  <path d="M 80 118
           C 200 105, 400 96, 600 100
           C 800 104, 1000 96, 1200 102
           C 1320 106, 1400 112, 1440 118
           L 1440 170
           C 1400 168, 1320 162, 1200 158
           C 1000 152, 800 160, 600 156
           C 400 152, 200 162, 80 172
           Z"
        fill="url(#bodyGradBot)"/>

  <!-- Body upper highlight stripe -->
  <path d="M 80 118
           C 200 105, 400 96, 600 100
           C 800 104, 1000 96, 1200 102
           L 1440 118 L 1440 128
           C 1200 116, 1000 110, 800 114
           C 600 118, 400 112, 200 120
           C 130 122, 100 124, 80 128
           Z"
        fill="#3acc60" opacity="0.32"/>

  <!-- ===== SPINE RIDGES (largest near tail, fading right) ===== -->
  <!-- Large spines near the tail tip -->
  <path d="M 105 118 L 118 96 L 131 118" fill="#0a3515" opacity="0.82"/>
  <path d="M 155 114 L 170 90 L 185 114" fill="#0a3515" opacity="0.78"/>
  <path d="M 212 110 L 228 86 L 244 110" fill="#0a3515" opacity="0.72"/>
  <path d="M 278 107 L 296 82 L 313 107" fill="#0a3515" opacity="0.65"/>
  <path d="M 354 105 L 373 79 L 391 105" fill="#0a3515" opacity="0.58"/>
  <path d="M 438 104 L 458 77 L 477 104" fill="#0a3515" opacity="0.52"/>
  <path d="M 530 103 L 551 76 L 571 103" fill="#0a3515" opacity="0.46"/>
  <path d="M 628 102 L 650 75 L 671 102" fill="#0a3515" opacity="0.40"/>
  <path d="M 732 102 L 754 76 L 775 102" fill="#0a3515" opacity="0.34"/>
  <path d="M 842 103 L 864 78 L 885 103" fill="#0a3515" opacity="0.28"/>
  <path d="M 958 104 L 980 79 L 1001 104" fill="#0a3515" opacity="0.22"/>
  <path d="M 1078 105 L 1100 82 L 1121 105" fill="#0a3515" opacity="0.16"/>

  <!-- ===== SCALE ELLIPSES on body ===== -->
  <ellipse cx="250" cy="145" rx="28" ry="10" fill="#0f4f20" opacity="0.45"/>
  <ellipse cx="420" cy="141" rx="31" ry="11" fill="#0f4f20" opacity="0.4"/>
  <ellipse cx="600" cy="138" rx="34" ry="11" fill="#0f4f20" opacity="0.35"/>
  <ellipse cx="790" cy="137" rx="36" ry="12" fill="#0f4f20" opacity="0.3"/>
  <ellipse cx="985" cy="137" rx="38" ry="12" fill="#0f4f20" opacity="0.25"/>
  <ellipse cx="1185" cy="138" rx="40" ry="13" fill="#0f4f20" opacity="0.2"/>
  <ellipse cx="1370" cy="140" rx="42" ry="13" fill="#0f4f20" opacity="0.15"/>
</svg>
